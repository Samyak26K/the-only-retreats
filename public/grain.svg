<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>
  <filter id='noise' x='0%' y='0%' width='100%' height='100%'>
    <feTurbulence 
      type='fractalNoise' 
      baseFrequency='0.75' 
      numOctaves='4' 
      stitchTiles='stitch'
      result='noiseOut'
    />
    <feColorMatrix 
      type='saturate' 
      values='0' 
      in='noiseOut' 
      result='grayNoise'
    />
    <feBlend 
      in='SourceGraphic' 
      in2='grayNoise' 
      mode='overlay' 
      result='blend'
    />
    <feComposite 
      in='blend' 
      in2='SourceGraphic' 
      operator='in'
    />
  </filter>
  <rect width='300' height='300' filter='url(#noise)' 
    opacity='0.15' fill='white'/>
</svg>
